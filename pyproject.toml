[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cirplas"
version = "0.1.0.dev0"
description = "Plasma-dedicated circuit simulator for CCP reactors (ngspice backend)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "h5py>=3.11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13"]
dev = ["pytest>=8"]
gui-dev = ["pytest-qt>=4.4"]

[project.scripts]
cirplas-solve = "cirplas.worker.cli:main"
cirplas-gui = "cirplas.gui.app:main"

[tool.setuptools.packages.find]
include = ["cirplas*"]

[tool.setuptools.package-data]
cirplas = ["data/*.json", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
